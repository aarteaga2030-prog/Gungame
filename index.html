<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Killhouse Sim</title>
<link rel="stylesheet" href="style.css" />
<script type="importmap">
{ "imports": { "three": "./lib/three.module.min.js" } }
</script>
</head>
<body>
<canvas id="view"></canvas>

<div id="loading" class="screen">
  <div class="load-box">
    <div class="brand">KILLHOUSE<span>//SIM</span></div>
    <div class="load-bar"><div id="loadFill"></div></div>
    <div id="loadText">Loading assets…</div>
  </div>
</div>

<div id="menu" class="screen hidden">
  <header class="menu-head">
    <div>
      <div class="brand">KILLHOUSE<span>//SIM</span></div>
      <div class="sub">Pick a map, a mission and the enemy. The AI fights only from its training and what it can see and hear.</div>
    </div>
    <label class="name-field">Callsign <input id="optName" maxlength="14" value="Operator" /></label>
  </header>
  <div class="setup">
    <section class="col-maps">
      <h3>Map</h3>
      <div id="mapGrid"></div>
    </section>
    <section class="col-opts">
      <h3>Mode</h3>
      <div class="seg" id="segMode">
        <button data-v="play" class="on"><b>Play</b><span>You fight the AI, solo or with friends.</span></button>
        <button data-v="watch"><b>AI vs AI</b><span>Pick two forces and watch them fight.</span></button>
      </div>
      <h3>Mission</h3>
      <div class="seg" id="segMission">
        <button data-v="breach" class="on"><b>Breach</b><span id="mBreach">You assault the building. The AI defends it.</span></button>
        <button data-v="defense"><b>Defend</b><span id="mDefend">You hold the building. The AI attacks it.</span></button>
      </div>
      <div id="blueBlock" class="hidden">
        <h3>Blue force</h3>
        <div class="diffs" id="diffsBlue"></div>
      </div>
      <h3 id="redHead">Enemy force</h3>
      <div class="diffs" id="diffs"></div>
      <div id="matesBlock">
      <h3>AI teammates on your side</h3>
      <div class="seg small" id="segMates">
        <button data-v="0" class="on">0</button><button data-v="1">1</button><button data-v="2">2</button><button data-v="3">3</button>
      </div>
      </div>
      <div class="play">
        <button id="btnSolo" class="primary big">Play solo</button>
        <div class="mp">
          <button id="btnHost">Host online game</button>
          <div class="join"><input id="joinCode" placeholder="Room code" maxlength="12" /><button id="btnJoin">Join</button></div>
          <div id="netStatus" class="note">Checking online play…</div>
        </div>
      </div>
      <details class="manual">
        <summary>AI training <span id="manualCount"></span></summary>
        <div id="manual"></div>
      </details>
    </section>
  </div>
  <section class="controls-ref">
    <h3>Controls</h3>
    <div class="controls" id="controlsRef"></div>
  </section>
</div>

<div id="lobby" class="screen hidden">
  <div class="panel wide">
    <div class="lobby-code">ROOM <b id="lobbyCode"></b></div>
    <div id="lobbyCfg" class="lobby-cfg"></div>
    <div id="lobbyPlayers" class="lobby-players"></div>
    <div id="lobbyNote" class="note"></div>
    <div class="res-btns">
      <button id="btnLobbyStart" class="primary">Start mission</button>
      <button id="btnLobbyLeave" class="ghost">Leave</button>
    </div>
  </div>
</div>

<div id="hud" class="hidden">
  <div class="hud-tl"><div id="hudMission"></div><div id="hudEnemy"></div></div>
  <div class="hud-tc"><div id="hudPhase"></div><div id="hudTimer"></div></div>
  <div class="hud-tr" id="squad"></div>
  <div class="hud-br" id="loadout"></div>
  <div class="hud-bl" id="hint"></div>
  <div id="prompt"></div>
  <div id="channel"><div id="channelFill"></div><span id="channelText"></span></div>
  <div id="feed"></div>
  <div id="spectate"></div>
  <div id="vignette"></div>
  <div id="flash"></div>
</div>

<div id="pause" class="screen dim hidden">
  <div class="panel">
    <h2 id="pauseTitle">PAUSED</h2>
    <button id="btnResume" class="primary">Resume</button>
    <button id="btnRestart">Restart mission</button>
    <button id="btnQuit" class="ghost">Quit to menu</button>
  </div>
</div>

<div id="results" class="screen dim hidden">
  <div class="panel wide">
    <div id="resTitle"></div>
    <div id="resReason"></div>
    <div id="resStats"></div>
    <div class="res-btns">
      <button id="btnAgain" class="primary">Play again</button>
      <button id="btnMenu" class="ghost">Main menu</button>
    </div>
  </div>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
